[package]
name = "apify-openrouter-relay"
version = "0.1.0"
edition = "2024"
description = "Streaming Standby Actor for Apify OpenRouter"

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
url = "2"

[dev-dependencies]
futures-util = "0.3"
